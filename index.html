<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2ec">
  <meta name="description" content="Маған жазу үшін осы жерді басыңыз.">
  <title>Маған жазу үшін осында бас</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #1c1b19;
      background: #f5f2ec;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    .screen {
      min-height: 100vh;
      min-height: 100svh;
      width: 100%;
      display: flex;
      flex-direction: column;
      padding: 28px clamp(22px, 6vw, 88px);
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .screen:focus-visible { outline: 3px solid #1c1b19; outline-offset: -6px; }
    .top, .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: #69655f;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .13em;
      line-height: 1.4;
      text-transform: uppercase;
    }
    .top { padding-bottom: 20px; border-bottom: 1px solid #d9d3c9; }
    .bottom { padding-top: 20px; border-top: 1px solid #d9d3c9; }
    .mark { width: 10px; height: 10px; flex: 0 0 auto; border-radius: 50%; background: #1c1b19; }
    main {
      flex: 1;
      width: 100%;
      max-width: 1060px;
      margin: 0 auto;
      padding: 50px 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
    }
    .label {
      margin: 0 0 24px;
      color: #77716a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 1000px;
      margin: 0;
      font-size: clamp(52px, 8.8vw, 116px);
      font-weight: 750;
      letter-spacing: -.065em;
      line-height: 1.02;
    }
    h1 span { display: block; color: #8d6b47; }
    .button {
      min-height: 68px;
      margin-top: 42px;
      padding: 0 25px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 54px;
      background: #1c1b19;
      color: #fff;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: .035em;
      text-transform: uppercase;
      transition: background .18s ease, transform .18s ease;
    }
    .arrow { font-size: 25px; font-weight: 400; line-height: 1; }
    .screen:hover .button { background: #5b4633; transform: translateY(-2px); }
    .screen:active .button { transform: translateY(0); }
    .hint { margin: 20px 0 0; color: #69655f; font-size: 15px; line-height: 1.5; }
    @media (max-width: 600px) {
      .screen { padding: 22px 22px 20px; }
      .top, .bottom { font-size: 10px; }
      main { padding: 40px 0; }
      .label { margin-bottom: 18px; font-size: 11px; }
      h1 { font-size: clamp(43px, 11vw, 66px); line-height: 1.04; }
      .button { width: 100%; min-height: 64px; margin-top: 30px; gap: 20px; }
      .hint { font-size: 14px; }
    }
    @media (max-width: 360px) {
      .screen { padding-inline: 18px; }
      h1 { font-size: 40px; }
      .bottom { font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) { .button { transition: none; } }
  </style>
</head>
<body>
  <a class="screen" href="https://t.me/oralov_na" aria-label="Маған жазу үшін осында бас">
    <header class="top"><span>Байланыс</span><span class="mark" aria-hidden="true"></span></header>
    <main>
      <p class="label">Жеке байланыс</p>
      <h1>Маған жазу үшін <span>осында бас.</span></h1>
      <span class="button">Осында басыңыз <span class="arrow" aria-hidden="true">↗</span></span>
      <p class="hint">Экранның кез келген жерін басыңыз</p>
    </main>
    <footer class="bottom"><span>Хабарласу</span><span>Осы жерді басыңыз</span></footer>
  </a>
</body>
</html>
